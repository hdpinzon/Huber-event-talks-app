<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON TECH 2026 | EVENT SCHEDULE</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-animation"></div>
    <header>
        <div class="container">
            <h1 class="glitch" data-text="NEON TECH 2026">NEON TECH 2026</h1>
            <p class="tagline">The Future of Innovation | Feb 6, 2026</p>
        </div>
    </header>

    <main class="container">
        <section id="filters" class="filter-section">
            <div class="search-container">
                <div class="filter-label">SEARCH BY SPEAKER:</div>
                <div class="search-wrapper">
                    <input type="text" id="speaker-search" placeholder="Enter speaker name..." class="neon-input" aria-label="Search by speaker name">
                    <button id="clear-filters" class="btn-clear" aria-label="Clear all filters">CLEAR PROTOCOLS</button>
                </div>
            </div>
            <div class="filter-label">FILTER BY CATEGORY:</div>
            <div id="category-tags" class="tags-container" role="group" aria-label="Filter by category">
                <!-- Tags will be dynamically populated -->
            </div>
        </section>

        <section id="schedule" class="schedule-container">
            <div id="loading-overlay" class="loading-overlay">
                <div class="loader"></div>
                <p>DECRYPTING PROTOCOLS...</p>
            </div>
            <div class="timeline-line"></div>
            <!-- Talks will be dynamically populated -->
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 NEON TECH EVENT | PROTOCOL: SECURE</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
